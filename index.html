<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Re di Belluno</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%91%91%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
:root{--panel:#10162f;--line:#2a3566;--txt:#eef1ff;--mut:#9aa6d6;--gold:#ffcf4a}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:Outfit,system-ui,sans-serif;color:var(--txt);overflow:hidden;background:#0b1026}
.app{display:flex;height:100%}
#wrap{flex:1;min-width:0;position:relative;cursor:grab}
#wrap.drag{cursor:grabbing}
#wrap canvas{display:block}
.hud{position:absolute;left:16px;top:16px;display:flex;flex-direction:column;gap:8px;align-items:flex-start;pointer-events:none}
#players{display:flex;flex-direction:column;gap:6px}
.pl{display:flex;align-items:center;gap:8px;background:#0b1026cc;border:1px solid #ffffff30;border-radius:12px;padding:6px 12px;font-weight:800;font-size:14px;backdrop-filter:blur(6px)}
.pl i{width:14px;height:14px;border-radius:50%;border:2px solid #fff8;flex:none}
.pl.cur{border-color:#fff;box-shadow:0 0 0 2px #ffffff66;background:#1d2656ee}
.pl.out{opacity:.4;text-decoration:line-through}
.pl span{color:#ffe08a;margin-left:6px}
#log{position:absolute;left:50%;bottom:172px;transform:translateX(-50%);display:flex;flex-direction:column;gap:4px;align-items:center;pointer-events:none;width:72%}
#log div{background:#0b1026dd;border:1px solid #ffffff30;border-radius:10px;padding:5px 12px;font-size:13px;font-weight:600;text-align:center}
#log div:last-child{font-size:15px;font-weight:800;border-color:#fff8}
#gbar{bottom:108px}
#gbar button{font-size:16px;padding:12px 18px}
#gbar{flex-wrap:wrap;justify-content:center;max-width:88%}
#gbar span{align-self:center;font-weight:800;padding:0 8px;max-width:520px}
#modal{position:absolute;inset:0;background:#050818cc;display:none;align-items:center;justify-content:center;z-index:20;cursor:default}
#modal.show{display:flex}
.box{background:linear-gradient(180deg,#1a2250,#0f1432);border:1px solid var(--line);border-radius:22px;padding:24px;width:min(660px,92%);max-height:92%;overflow:auto;display:flex;flex-direction:column;gap:14px}
.box h2{margin:0;font-size:26px;font-weight:900}
.whl{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.ws{padding:16px 4px;border-radius:12px;border:2px solid var(--line);text-align:center;font-weight:800;background:#0a0f2a}.ws.on{background:#ffd23d;color:#17224a;border-color:#fff;transform:scale(1.06)}
.mClose{position:sticky;top:0;align-self:flex-end;flex:none;margin-bottom:-52px;z-index:3;width:38px;height:38px;padding:0;border-radius:50%;font-size:17px;font-weight:900;background:#e23b3b;color:#fff;border-color:#fff8}
.panel.hide{display:none}
#hand{position:absolute;left:0;right:0;bottom:0;display:none;align-items:flex-end;gap:5px;padding:10px 10px 8px;z-index:5;cursor:default;background:linear-gradient(0deg,#0b1026f2 55%,#0b102600);overflow-x:auto}
#hand:before,#hand:after{content:'';flex:1}
#wrap.hand #hand{display:flex}#wrap.hand #chat{bottom:calc(var(--hh,104px) + 6px)}
.hg{flex:none;display:flex;flex-direction:column}.hg .hc{position:relative}.hg .hc+.hc{margin-top:-58px}.hg .hc span{place-items:start center;padding-top:3px}.hg .hc:hover{z-index:4}
.hc{flex:none;width:76px;height:86px;border-radius:9px;background:#fbf7ea;color:#17224a;border:2px solid #17224a;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;font-size:9.5px;font-weight:800;line-height:1.1;text-align:center;transition:transform .12s;box-shadow:0 3px 8px #0008}
.hc:hover{transform:translateY(-7px)}.hc b{display:block;height:16px;flex:none}.hc span{flex:1;display:grid;place-items:center;padding:2px 3px}.hc small{font-size:9px;font-weight:700;padding-bottom:4px;color:#5a6488}.hc.mo{opacity:.55}.hc.tk{background:linear-gradient(160deg,#f2fbff,#b9e3ff);border-color:#0b63a8;align-self:flex-end}.hc.tk b{background:repeating-linear-gradient(90deg,#0b63a8 0 8px,#3fb6e8 8px 16px)}
#handS{flex:none;align-self:center;font-size:11px;padding:7px 9px;margin-right:6px;white-space:nowrap}
.box p{margin:0;color:var(--mut)}
.prow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#0a0f2a;border:1px solid var(--line);border-radius:14px;padding:10px}
.prow input,.prow select{font:inherit;font-weight:700;color:#fff;background:#1d2656;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.prow input{width:150px}
.cardTop{border-radius:14px;padding:16px;font-weight:900;font-size:20px;letter-spacing:2px;color:#fff}
.cardTxt{font-size:20px;line-height:1.35;font-weight:600}
#why{color:#ffb86b;min-height:18px}
#chat{position:absolute;left:16px;bottom:56px;width:290px;display:none;flex-direction:column;gap:6px;z-index:5;cursor:default}
#chat.show{display:flex}
#chatLog{max-height:150px;overflow:auto;display:flex;flex-direction:column;gap:3px;font-size:13px}
#chatLog div{background:#0b1026cc;border:1px solid #ffffff25;border-radius:9px;padding:4px 9px;align-self:flex-start;max-width:100%;word-break:break-word}
.chatRow{display:flex;gap:4px}
.chatRow input{flex:1;min-width:0;font:inherit;font-size:13px;color:#fff;background:#0b1026dd;border:1px solid #ffffff40;border-radius:10px;padding:7px 9px}
.chatRow button{padding:5px 7px;font-size:15px;background:#0b1026dd}
.link{display:flex;gap:8px}.link input{flex:1;font:inherit;font-size:13px;color:#fff;background:#0a0f2a;border:1px solid var(--line);border-radius:10px;padding:9px}
.seat{display:flex;align-items:center;gap:10px;background:#0a0f2a;border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-weight:800}
.seat i{width:16px;height:16px;border-radius:50%;border:2px solid #fff8}.seat small{color:var(--mut);font-weight:600;margin-left:auto}
.chip{background:#0b1026cc;border:1px solid #ffffff30;border-radius:999px;padding:8px 14px;font-weight:800;font-size:14px;backdrop-filter:blur(6px)}
.chip small{color:var(--mut);font-weight:600;margin-right:6px}
#tip{position:absolute;display:none;z-index:6;pointer-events:none;background:#0b1026f2;border:1px solid #ffffff40;border-radius:12px;padding:8px 12px;max-width:290px;font-size:13.5px;line-height:1.3;color:#dfe5ff;box-shadow:0 6px 18px #000a}#tip b{display:block;font-size:15px;color:#fff;margin-bottom:2px}
.hint{position:absolute;left:16px;bottom:14px;background:#0b1026cc;border:1px solid #ffffff30;border-radius:12px;padding:8px 12px;font-size:13px;color:#dfe5ff;pointer-events:none;max-width:70%}
.bar{position:absolute;left:50%;bottom:54px;transform:translateX(-50%);display:flex;gap:8px;background:#0b1026cc;border:1px solid #ffffff30;border-radius:16px;padding:8px;backdrop-filter:blur(6px)}
.panel{width:330px;flex:none;background:linear-gradient(180deg,#151c40,#0d1230);border-left:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:12px;overflow:auto}
.panel>*{flex:none}
.bar button{white-space:nowrap}
.panel h1{margin:0;font-size:20px;font-weight:900}
.panel p{margin:0;color:var(--mut);font-size:13px;line-height:1.4}
.deed{border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#0a0f2a}
.deedTop{padding:12px 14px;background:var(--g,#445);color:var(--gt,#fff);min-height:62px}
.deedTop small{font-weight:800;letter-spacing:2px;opacity:.8;font-size:10.5px;text-transform:uppercase}
.deedTop div{font-size:20px;font-weight:900;line-height:1.1}
.rows{padding:6px 12px 10px}
.row{display:flex;justify-content:space-between;font-size:13px;padding:4px 6px;border-radius:7px;color:#c9d0f5}
.row b{color:#fff}
.row.on{background:#ffffff22;color:#fff;font-weight:800;outline:1px solid #ffffff55}
.row.sep{border-top:1px dashed var(--line);margin-top:4px;border-radius:0}
.ctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button{font:inherit;font-weight:800;color:#fff;border:1px solid var(--line);background:#1d2656;border-radius:11px;padding:9px 12px;cursor:pointer;transition:.15s}
button:hover{background:#2b3780}
button:disabled{opacity:.35;cursor:default}
button.big{flex:1;font-size:14.5px}
button.pri{background:linear-gradient(135deg,#1fb25a,#0e8a6a);border:0}
button.act{background:linear-gradient(135deg,#ed1b24,#f7941d);border:0}
button.on{background:#fff;color:#10162f;border-color:#fff}
.lab{font-size:11px;font-weight:800;letter-spacing:2px;color:var(--mut);text-transform:uppercase;margin-top:2px}
.sw{display:flex;gap:7px;flex-wrap:wrap}
.sw i{width:28px;height:28px;border-radius:9px;border:2px solid #ffffff40;cursor:pointer;display:block}
.sw i.on,.sw .pick.on{border-color:#fff;box-shadow:0 0 0 3px #ffffff55}
.sw .pick{width:28px;height:28px;border-radius:9px;border:2px dashed #ffffff80;cursor:pointer;display:grid;place-items:center;font-weight:900;font-size:15px;position:relative;overflow:hidden}
.sw .pick input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.edh{font-size:12px;color:var(--mut);margin:0}
.orn{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.orn button{font-size:13px;padding:7px 8px;text-align:left}
#custom.off{opacity:.35;pointer-events:none}
.hint{display:none}
#tools{position:absolute;right:14px;top:14px;display:flex;gap:6px;z-index:6}
#tools button{padding:8px 11px;font-size:16px;background:#0b1026cc;backdrop-filter:blur(6px)}
#tools button.on{background:#fff;color:#10162f}
#dock{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);width:min(860px,calc(100% - 330px));display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;z-index:5}
#dock>*{pointer-events:auto}
#log{position:static;transform:none;width:auto;max-width:100%}
#gbar{position:static;transform:none;max-width:100%;display:flex;flex-direction:column;flex-wrap:nowrap;gap:8px;align-items:center;background:#0b1026e8;border:1px solid #ffffff38;border-radius:18px;padding:10px 14px;backdrop-filter:blur(6px);cursor:default}
#gbar .st{font-weight:800;font-size:15px;text-align:center;line-height:1.3}
#gbar .btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
#gbar button{font-size:15px;padding:10px 15px;white-space:nowrap}
/* stato e pulsanti in alto, sotto le icone: il tabellone resta libero */
#dock{left:262px;right:14px;top:64px;bottom:auto;transform:none;width:auto;flex-direction:column-reverse;gap:6px}
#gbar{padding:7px 12px;gap:6px;border-radius:14px}#gbar .st{font-size:14px}#gbar button{font-size:14px;padding:8px 13px}
#log div{font-size:12px;padding:3px 10px}#log div:last-child{font-size:13.5px}
.pl{cursor:pointer;pointer-events:auto}
.pl small{color:var(--mut);font-weight:700;margin-left:4px}
#chat{left:14px;bottom:14px;width:270px}
#chatBox{display:none;flex-direction:column;gap:6px}
#chat.open #chatBox{display:flex}
#chatTog{align-self:flex-start;background:#0b1026dd}
#fx{position:absolute;inset:0;pointer-events:none;z-index:8;overflow:hidden}
.fxB{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);text-align:center;font-weight:900;animation:fxPop 2.1s ease forwards;text-shadow:0 4px 0 #0009,0 0 34px #000c;white-space:nowrap}
.fxB b{display:block;font-size:clamp(34px,6vw,84px);letter-spacing:2px}.fxB.sm b{font-size:clamp(24px,3.4vw,46px)}
.fxB small{display:block;font-size:clamp(13px,1.5vw,20px);margin-top:4px;color:#fff}
@keyframes fxPop{0%{opacity:0;transform:translate(-50%,-50%) scale(.3) rotate(-8deg)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.14) rotate(2deg)}22%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-90%) scale(1)}}
.fxP{position:absolute;top:0;font-size:26px;animation:fxFall linear forwards}
@keyframes fxFall{0%{transform:translate(0,-12vh) rotate(0)}100%{transform:translate(var(--dx),112vh) rotate(var(--r))}}
.fxC{position:absolute;font-size:22px;transition:transform .85s cubic-bezier(.3,.1,.3,1),opacity .4s}
.fxD{position:absolute;font-weight:900;font-size:14px;padding:2px 9px;border-radius:9px;color:#fff;white-space:nowrap;animation:fxUp 2s ease forwards}
@keyframes fxUp{0%{opacity:0;transform:translateY(8px)}12%{opacity:1;transform:translateY(0)}75%{opacity:1}100%{opacity:0;transform:translateY(-22px)}}
.fxJ{position:absolute;inset:0;animation:fxJ 2.5s ease forwards}
.fxJ:before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,#ff1a1a70,transparent 42%,transparent 58%,#1a5cff70);animation:fxSir .36s steps(2,jump-none) infinite}
@keyframes fxSir{0%{transform:scaleX(1)}100%{transform:scaleX(-1)}}
.fxJ i{position:absolute;top:0;bottom:0;width:2.2%;background:linear-gradient(90deg,#11141c,#6b7388,#11141c);box-shadow:0 0 14px #000;animation:fxBar .55s cubic-bezier(.5,0,.6,1.35) both}
@keyframes fxBar{0%{transform:translateY(-105%)}100%{transform:translateY(0)}}
@keyframes fxJ{0%,84%{opacity:1}100%{opacity:0}}
#wrap.shake canvas{animation:fxShake .6s}
@keyframes fxShake{0%,100%{transform:translate(0,0)}15%{transform:translate(-9px,5px)}30%{transform:translate(8px,-6px)}45%{transform:translate(-7px,-4px)}60%{transform:translate(6px,5px)}80%{transform:translate(-3px,2px)}}
#musBox .big{text-align:left}#musBox .big.on{background:#fff;color:#10162f}
#diceBox{position:absolute;left:50%;top:42%;transform:translateX(-50%);display:none;gap:20px;z-index:7;pointer-events:none}
#diceBox.show{display:flex}
.die{width:78px;height:78px;border-radius:17px;background:linear-gradient(145deg,#fff,#dfe3f0);box-shadow:0 12px 34px #000b,inset 0 -6px 0 #c7cde0;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:12px;gap:3px}
.die i{border-radius:50%}.die i.p{background:#17224a}
.die.roll{animation:dshake .16s linear infinite}
@keyframes dshake{0%{transform:rotate(-16deg) translateY(-8px)}50%{transform:rotate(14deg) translateY(5px)}100%{transform:rotate(-16deg) translateY(-8px)}}
details{border:1px solid var(--line);border-radius:12px;background:#0a0f2a;padding:0 10px}
details summary{cursor:pointer;font-weight:800;padding:10px 2px;list-style:none;font-size:14.5px}
details summary::-webkit-details-marker{display:none}
details summary::after{content:'▾';float:right;color:var(--mut)}
details[open] summary::after{content:'▴'}
details .in{padding:0 0 12px;display:flex;flex-direction:column;gap:8px}
#custom{display:flex;flex-direction:column;gap:8px}
.pm{display:flex;align-items:center;gap:8px;background:#0a0f2a;border:1px solid var(--line);border-radius:12px;padding:7px 10px;font-size:13.5px;font-weight:700}
.pm i{width:14px;height:14px;border-radius:4px;flex:none}.pm small{color:var(--mut);font-weight:600}.pm .sp{flex:1}
.pm button{padding:5px 9px;font-size:13px}.pm a{text-decoration:underline dotted}
</style>
</head>
<body>
<div class="app">
  <div id="wrap">
    <div class="hud"><div id="players"></div><div class="chip" id="dice" style="display:none"></div><div class="chip" id="seas" style="display:none;cursor:help"></div><span id="where" style="display:none"></span></div>
    <div id="tools"><button id="bOrbit" class="on" title="Vista dall'alto">🗺️</button><button id="bWalk" title="Cammina tra le vie">🚶</button><button id="bN" title="Giorno / notte">🌙</button><button id="bS" title="Suoni">🔊</button><button id="bM" title="Musica">🎵</button><button id="bG" title="Giornale di Belluno">📰</button><button id="bR" title="Regole in breve">📖</button><button id="bP" class="on" title="Mostra o nascondi il pannello di destra">📝</button><button id="bQ" title="Qualità grafica">HD</button><button id="bNew" title="Menu della partita">⚙️</button></div>
    <div id="fx"></div>
    <div id="diceBox"><div class="die" id="d1"></div><div class="die" id="d2"></div></div>
    <div id="dock"><div id="log"></div><div id="gbar"></div></div>
    <div id="hand"></div>
    <div id="chat"><div id="chatBox"><div id="chatLog"></div><div class="chatRow"><select id="chatTo" title="A chi scrivi" style="max-width:92px;font:inherit;color:#fff;background:#1d2656;border:1px solid #ffffff40;border-radius:9px"><option value="">Tutti</option></select><input id="chatIn" maxlength="120" placeholder="Scrivi agli amici…"><button data-e="😂">😂</button><button data-e="😱">😱</button><button data-e="💸">💸</button><button data-e="👏">👏</button></div></div><button id="chatTog">💬 Chat</button></div>
    <div id="modal"></div>
    <div id="tip"></div>
    <div class="hint" id="hint"></div>
  </div>
  <aside class="panel">
    <h1>Re di Belluno</h1>
    <div class="deed" id="deed"></div>
    <div class="ctrl">
      <button class="big" id="minus">− Togli</button>
      <button class="big pri" id="plus">+ Casa qui</button>
    </div>
    <div class="ctrl"><button class="big" id="mort">Ipoteca</button></div>
    <p id="why"></p>
    <div class="ctrl"><button class="big" id="bZoom">🔍 Guarda da vicino</button></div>
    <div id="custom">
      <details><summary>🎨 Colori</summary><div class="in">
        <p id="edWhat" class="edh"></p><div class="lab" id="labWall">Muri</div><div class="sw" id="swWall"></div>
        <div class="lab" id="labRoof">Tetto</div><div class="sw" id="swRoof"></div>
        <div class="lab" id="labAcc">Persiane e porta</div><div class="sw" id="swAcc"></div></div></details>
      <details><summary>🌳 Ornamenti</summary><div class="in"><div class="orn" id="orn"></div></div></details>
      <details><summary>🏠 Stile di case e albergo</summary><div class="in">
        <div class="lab">Case</div><div class="orn" id="styH" style="grid-template-columns:1fr 1fr 1fr"></div>
        <div class="lab">Albergo</div><div class="orn" id="styA" style="grid-template-columns:1fr 1fr 1fr"></div></div></details>
      <details><summary>✨ Tema della serie completa</summary><div class="in">
        <div class="orn" id="thm" style="grid-template-columns:1fr 1fr"></div>
        <div class="lab">Colore delle luci</div><div class="sw" id="swL"></div></div></details>
    </div>
  </aside>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ================= DATI ================= */
const G=['#955436','#8fd3f4','#d93a96','#f7941d','#ed1b24','#ffe600','#1fb25a','#0072bb'];
const GT=['#fff','#10162f','#fff','#10162f','#fff','#10162f','#fff','#fff'];
const GN=['Marrone','Azzurro','Rosa','Arancione','Rosso','Giallo','Verde','Blu'];
const HC=[50,50,100,100,150,150,200,200];
/* tabellone: 4 quartieri (Quadrifoglio) oppure 1 (tabellone piccolo, con ?tavola=piccola) */
const CLASSIC=/[?&]modo=classica/.test(location.search);
const NQ=/[?&]tavola=piccola/.test(location.search)?1:4,RB=53,QN=['Centro storico','Cavarzano','Nevegal','Piave'],
  DIS=i=>i<RB?0:1+Math.floor((i-RB)/40),LOC=i=>i<40?i:i>=RB?(i-RB)%40:-1,RING=(d,l)=>d===0?l:RB+(d-1)*40+l;
if(NQ>1){for(let d=1;d<NQ;d++)for(let c=0;c<8;c++){G.push(G[c]);GT.push(GT[c]);GN.push(GN[c]+' · '+QN[d]);HC.push(HC[c]);}for(let c=0;c<8;c++)GN[c]+=' · Centro';}
const P=(n,g,p,r)=>({t:'prop',n,g,p,r});
const S=(n,ic)=>({t:'sta',n,ic,p:200});
const T=[
 {t:'corner',n:'Partenza',ic:'🚀',sub:'Ritira 200.000 €',c:'#1fb25a'},
 P('Borgo Prà',0,60,[2,10,30,90,160,250]),
 {t:'cc',n:'Cassa comune',ic:'🎁'},
 P('Borgo Piave',0,60,[4,20,60,180,320,450]),
 {t:'tax',n:'Tassa sul reddito',ic:'💸',p:200},
 S('Stazione dei treni','🚂'),
 P('Via Feltre',1,100,[6,30,90,270,400,550]),
 {t:'ch',n:'Imprevisto',ic:'❓'},
 P('Via Vittorio Veneto',1,100,[6,30,90,270,400,550]),
 P('Via Col di Lana',1,120,[8,40,100,300,450,600]),
 {t:'corner',n:'Prigione',ic:'⛓️',sub:'Di passaggio',c:'#f7941d'},
 P('Via Garibaldi',2,140,[10,50,150,450,625,750]),
 {t:'util',n:'Diga sul Piave',ic:'⚡',p:150},
 P('Via Jacopo Tasso',2,140,[10,50,150,450,625,750]),

    $('rIn').onclick=()=>{modal('');res(true);};$('mX').onclick=()=>{modal('');res(false);};});

function bankrupt(pl,to){pl.out=true;say(`💥 ${pl.name} è in bancarotta${to?': tutto passa a '+to.name:''}.`);

   +(can?'':'<p><small>Le azioni si fanno nel tuo turno, prima dei dadi o prima di chiudere.</small></p>')+`<div class="ctrl"><button class="big" id="mX">Chiudi</button></div>`;

function rulesModal(){const R=[
 ['🎯 Scopo','Conquista Belluno: compra, costruisci e manda in bancarotta gli altri finché tutto è tuo. Vince chi resta ultimo.'],
 ['👑 Titoli e Re',`Il tuo <b>patrimonio</b> (contanti, vie, case, opere) ti dà un titolo: ${TIT.map(t=>t[1]+' '+t[0]+(t[2]?' da '+EUR(t[2]):'')).join(', ')}. Il Conte più ricco è il <b>Re</b> 👑: ${EUR(RE_SAL)} in più di stipendio e la corona sulla pedina. Ma sul Re c’è la <b>taglia</b>: chi gli fa pagare un affitto prende dalla banca un premio pari a metà dell’affitto.`],
 ['🏛️ Municipio e bustarelle',`Pulsante <b>🏛️ Potere</b>, nel tuo turno. A ogni cambio di stagione il Comune dà un <b>appalto</b>: ${EUR(APP_CASH)} e affitti +25% per una stagione. Vince chi ha promesso in segreto la bustarella più alta, e la paga. Chi ha promesso una busta rischia lo <b>scandalo</b>: multa e una stagione di affitti −25%. Puoi <b>denunciare</b> un altro: se aveva una busta lo rovini e incassi, se no paghi tu per calunnia.`],
 ['🕯️ Confraternita segreta',`Solo online, da 3 giocatori. Un Notabile può fondarla (${EUR(SET_FEE)}) e invitare gli altri con una lettera. Tra membri l’affitto è a metà. La <b>cassa nera</b> cresce di nascosto e paga le <b>mosse nell’ombra</b> del Gran Maestro: insabbiare, sabotare, truccare l’appalto. Chi è fuori può accusare: se indovina un membro, la setta si scioglie.`],
 ['🧳 Trasferte',`Sul tabellone grande non puoi restare sempre a casa tua. Quando finisci il giro in un quartiere <b>diverso</b> dal giro prima, prendi un <b>bonus trasferta</b> di ${EUR(TRIP)} oltre allo stipendio. Ma al <b>terzo giro di fila nello stesso quartiere</b> lo stipendio salta, e continua a saltare finché non cambi quartiere dalle Porte.`],
 ['📦 Commesse e prezzi',`A ogni cambio di stagione ricevi una <b>commessa</b>: una consegna in una via di un altro giocatore, spesso una delle sue serie complete. Se ti fermi lì paghi l’affitto ma incassi il premio (da ${EUR(PWR(400))} in su, più alto dove l’affitto è alto). Scade al cambio di stagione. Chi ha una <b>serie completa</b> ne sceglie il prezzo una volta a stagione: <b>basso</b> (affitti −30%, ma ${EUR(FLOW)} dalla banca per ogni cliente), normale, <b>alto</b> (affitti +40%).`],
 ['🏭 La tua impresa e il signore del lato',`Ogni giocatore ha un <b>lotto personale</b> davanti alla città. Dal titolo di Mercante puoi costruirci una sola impresa (${EUR(IMP_FEE)}): ${IMP.map(x=>'<b>'+x[1]+'</b>, '+x[2]).join('; ')}. Il livello segue il tuo titolo (Mercante 1, Notabile 2, Conte 3, Re 4). Se ti arrestano resta chiusa due stagioni. <b>Signore del lato</b>: se tutte le vie, stazioni e società di un lato di un quartiere sono tue, lì gli affitti salgono del 25%.`],
 ['💼 Soldi sporchi',`Su una tua via puoi aprire un’<b>attività di copertura</b> (${EUR(FRONT_FEE)}, massimo 3): a ogni tuo giro rende ${EUR(FRONT_INC)} di <b>soldi sporchi</b>, che vedi solo tu. Pagano solo cose sporche (buste, polizia, giudici, cronisti, congiure). Per usarli come soldi veri li <b>ricicli</b>, perdendone un terzo (il 15% se sei in una setta). Ogni attività e ogni riciclaggio alzano il <b>sospetto della Finanza</b>, una percentuale che vedi nel pannello: è la probabilità del <b>blitz</b> a fine stagione (attività chiuse, soldi sequestrati, una condanna). Se il sospetto è alto il Giornale parla della via: chi capisce può denunciarti. I <b>contanti degli altri sono nascosti</b>: vedi solo il valore delle loro proprietà.`],
 ['⚖️ Tribunale e Questura',`Chi viene beccato prende una <b>condanna</b>, che resta per tutta la partita. La recidiva costa sempre di più (${EUR(REC_FINE)} in più per ogni condanna che avevi). Con 2 condanne sei sorvegliato speciale: rischio doppio e niente appalti. Alla 3ª <b>prigione e confisca</b> della tua proprietà più preziosa, e da lì ogni condanna è un altro arresto. Puoi <b>pagare la polizia</b> per una stagione di protezione (prezzo che raddoppia) o <b>comprare un giudice</b> per cancellare una condanna (ma 3 volte su 10 ti denuncia).`],
 ['🗡️ Complotti e guerra tra sette',`<b>Ricatto</b>: se pensi che uno nasconda una busta o una setta, lo ricatti: se è vero ti paga ${EUR(BLK)} in silenzio, se è pulito paghi tu. <b>Congiura contro il Re</b>: paghi ${EUR(PLOT_FEE)} in segreto; se a fine stagione i congiurati sono abbastanza, il Re perde soldi e corona. A Belluno possono nascere <b>due sette</b>: si spiano, si rubano la cassa nera, si smascherano a vicenda. Chi tradisce la sua setta per l’altra porta via un quarto della cassa.`],
 ['📜 Contratti e stampa',`In <b>🏛️ Potere</b> puoi proporre un <b>contratto</b> a un altro: soldi subito, una quota (25% o 50%) degli affitti di una serie, uno sconto sugli affitti tra voi, la durata in stagioni e la penale per chi lo rompe. Se accetta, il gioco lo applica da solo. E il <b>Giornale si compra</b>: una volta a stagione puoi far sparire le notizie su di te, pagare un articolo a tuo favore (affitti +15%), lanciare fango su un altro (affitti −15%) o farti dire quante buste girano in Municipio.`],
 ['📰 Giornale e jet',`A ogni cambio di stagione esce il <b>Giornale di Belluno</b> (pulsante 📰) con chi sale, chi crolla, scandali e colpi grossi. Con ${EUR(JET)} compri il <b>jet privato</b>: voli a inizio turno senza biglietto, una volta ogni ${JET_CD} tuoi turni. Puoi invitare un altro giocatore a bordo: se accetta atterra con te e fate la <b>riunione nel jet</b>, dove si firmano contratti speciali (quota fino al 75%, fino a 32 stagioni). Il Giornale però vi vede scendere insieme.`],
 ...(NQ>1?[['💰 Soldi sul tabellone grande',`Si parte con <b>${EUR(START)}</b>. Gli affitti senza case, delle stazioni e delle società sono <b>doppi</b>. Lo <b>stipendio cresce</b>: ${EUR(SAL)} più ${EUR(SALV)} per ogni tua via non ipotecata. A ogni cambio di stagione c’è la <b>lotteria</b>: chi ha almeno ${EUR(LOT_T)} compra un biglietto, la banca aggiunge ${EUR(LOT_B)}, uno solo vince tutto.`]]:[]),
 ['🎲 Il turno','Tiri i dadi e avanzi. Con un doppio tiri ancora; al terzo doppio di fila vai in prigione. Poi premi <b>Fine turno</b>.'],
 ['🏠 Vie, stazioni e società',`Se la casella è libera puoi comprarla. Se non la compri va all’<b>asta</b>: 15 secondi, tutti offrono quanto vogliono. Se è di un altro, gli paghi l’affitto. Con tutta una serie di un colore l’affitto raddoppia e puoi costruire case e alberghi.`],
 ['🚀 Partenza',`Ogni volta che ci passi ritiri <b>${EUR(SAL)}</b>${SALV?' (più '+EUR(SALV)+' per ogni tua via)':''}, più la rendita delle tue opere in centro. Qui vendi anche gli oggetti del mercatino.`],
 ...(NQ>1?[['🧭 I quattro quartieri',`Il tabellone è un <b>quadrifoglio</b>: quattro quartieri ad anello (${QN.join(', ')}) attorno alla <b>Piazza del Re</b>. Ogni quartiere ha la sua <b>Porta</b> sulla piazza. Quando sei su una Porta scegli: entri nel quartiere, oppure prosegui sulla piazza verso il quartiere dopo. Ogni volta che finisci il giro di un quartiere e ripassi dalla sua Porta ritiri lo stipendio. Stazioni e società contano quartiere per quartiere. Prigione, aeroporto, strada interna e sagra sono nel Centro storico. La camera segue il quartiere di chi è di turno: con la rotellina ti allontani e vedi tutta la mappa.`]]:[]),
 ['🛣️ Strada interna',`È la strada che taglia in mezzo al tabellone. <b>Si entra solo passando dalla Stazione dei treni</b> (in basso al centro): il gioco ti chiede se vuoi prenderla. Ha 8 caselle e ti fa uscire alle Scale mobili di Lambioi, dall’altra parte: è una scorciatoia, salti metà giro. <b>Non puoi prenderla due giri di fila</b>: dopo averla usata, al passaggio dopo resti sul giro esterno.`],
 ['🚧 Casello',`È la prima casella della strada interna. Chi entra nella strada paga <b>${EUR(TOLL)}</b> di pedaggio. Chi compra il Casello (${EUR(T[40].p)}) incassa tutti i pedaggi degli altri. Lui paga solo la metà, ${EUR(TOLL/2)}, alla banca. Finché il Casello è libero, il pedaggio va alla banca.`],
 ['🎡 Le altre caselle interne',`<b>Ruota della fortuna</b>: vinci o perdi soldi, o vinci un oggetto. <b>Parco</b>: non succede niente. <b>Ponte sul Piave</b>: ritiri ${EUR(30)}. <b>Autovelox</b>: paghi ${EUR(T[45].p)}. <b>Belvedere</b>: peschi un Imprevisto. <b>Banco dei pegni</b>: vendi subito i tuoi oggetti al 50% in più.`],
 ['🎪 Via delle sagre',`È la via con le bancarelle sul lato sinistro. <b>Si entra dall’angolo della Prigione</b> e si esce al Mercatino: 5 caselle al posto delle 9 vie di quel lato. È aperta solo nei primi ${SAG_ON} giri di turni di ogni stagione (che ne dura ${SEAS_LEN}): quando è chiusa le caselle sono grigie e ci sono le sbarre. L’ingresso costa ${EUR(SAG_FEE)}. Non puoi entrarci due giri di fila. Dentro: <b>tiro a segno</b> (vinci ${EUR(60)} o perdi ${EUR(30)}), <b>osteria</b> (paghi ${EUR(15)} a ogni giocatore), <b>lotteria</b> (biglietto ${EUR(20)}, primo premio ${EUR(500)}), <b>ballo in piazza</b> (ogni giocatore ti dà ${EUR(15)}), <b>pesca di beneficenza</b> (un oggetto gratis).`],
 ['✈️ Aeroporto e voli',`Se capiti sull’Aeroporto puoi comprare un <b>biglietto</b> a ${EUR(AIRTK)}. I soldi vanno al proprietario dell’Aeroporto (lui lo paga ${EUR(AIRTK/5)}). Ne tieni uno solo. All’inizio di un tuo turno puoi usarlo <b>al posto dei dadi</b>: voli su una stazione, su un angolo o su una tua proprietà. Volando alla Partenza non prendi lo stipendio. Il biglietto scade la seconda volta che passi dalla Partenza. Non si usa dalla prigione.`],
 ['🧺 Mercatino',`Nell’angolo in alto a sinistra. Paghi ${EUR(MKT)} e scegli un oggetto coperto: può valere poco o tantissimo. Lo scopri quando lo vendi alla banca, passando dalla Partenza. Massimo ${MKT_MAX} oggetti.`],
 ['🏗️ Opere del centro',`I <b>lotti liberi</b> hanno un bordo dorato e il cartello “LOTTO LIBERO”: cliccali per vedere cosa ci puoi costruire. Quando hai almeno <b>${EUR(RICH)}</b> in contanti compare il pulsante per costruire una grande opera (stadio, castello, ruota…). Ti rende l’8% del suo costo a ogni passaggio dalla Partenza. In più ogni opera ha un potere: ${MONS.map(m=>'<b>'+m[1]+'</b>: '+MONFX[m[0]]).join(' ')}`],
 ['👔 Manager e operai',`In <b>📋 Le mie proprietà</b> puoi assumere personale. Il <b>manager</b> va su una serie completa: gli affitti di quella serie salgono del 20%. Costa ${EUR(MGR_PAY)} subito e a ogni passaggio dalla Partenza. Gli <b>operai</b> vanno su stazioni e società: affitto +50%, ${EUR(WRK_PAY)} subito e a ogni giro. Li licenzi quando vuoi. Se non hai i soldi della paga, se ne vanno. Alla Partenza il <b>giorno di paga</b> ti dice quanto incassi e quanto paghi.`],
 ['🗓️ Stagioni',`Cambiano ogni ${SEAS_LEN} giri di turni. Ogni stagione fa rendere di più alcune opere e ha i suoi imprevisti. La scritta in alto a sinistra dice quale stagione è.`],
 ['⛓️ Prigione',`Esci con un doppio, pagando ${EUR(BAIL)}, oppure con la carta. Al terzo tentativo fallito paghi e esci.`],
 ['💸 Se finisci i soldi','Vendi le case (a metà prezzo), ipoteca le proprietà (incassi metà prezzo, niente affitto finché non riscatti) oppure cedi proprietà a chi devi pagare: chi le riceve le ottiene libere dall’ipoteca. Se non basta, sei in bancarotta.'],
 ['🤝 Scambi','Nel tuo turno puoi proporre a un altro giocatore uno scambio di proprietà e soldi. Lui accetta o rifiuta.']];
  modal(`<h2>📖 Regole in breve</h2>${R.map(r=>`<div><b style="font-size:15.5px">${r[0]}</b><p style="margin-top:3px">${r[1]}</p></div>`).join('')}<button class="big pri" id="mX">Ho capito</button>`);$('mX').onclick=()=>modal('');}

  g.children.forEach(c=>c.castShadow=false);return g;}
const canAct=()=>GM.on&&GM.phase!=='over'&&GM.phase!=='auction'&&GM.phase!=='trade'&&mine()&&(!GM.busy||GM.phase==='buy'||GM.phase==='debt');

const themeOk=g=>!GM.on||(NET.on?(!!myPl()&&hasSet(myPl(),g)):GM.players.some(p=>!p.out&&hasSet(p,g)));
const cosm=x=>({wall:x.wall,roof:x.roof,acc:x.acc,style:x.style,hstyle:x.hstyle,orn:Object.assign({},x.orn)});
function decoSync(i){if(!NET.on||!NET.started)return;if(mine())netPush();else bcast('deco',{i,s:cosm(st[i])});}
function themeSync(g){if(!NET.on||!NET.started)return;if(mine())netPush();else bcast('theme',{g,theme:grp[g].theme,light:grp[g].light});}
function select(i){

  if(focOn&&sel!==i){(bldG[i]||tileG[i]).getWorldPosition(foc);foc.y=.9;}
  sel=i;const t=T[i],isP=t.t==='prop',buyable=t.p&&t.t!=='tax',o=GM.owner[i];let h='';

    const L=['Affitto base','Con 1 casa','Con 2 case','Con 3 case','Con 4 case','Con albergo'];

  }else{
    deed.style.setProperty('--g','#39446e');deed.style.setProperty('--gt','#fff');
    const txt={sta:['Stazione',[['Con 1 stazione',EUR(25*RM)],['Con 2 stazioni',EUR(50*RM)],['Con 3 stazioni',EUR(100*RM)],['Con 4 stazioni',EUR(200*RM)],['Prezzo',EUR(200)]]],
      util:['Società',[['Con 1 società',EUR(4*RM)+' × i dadi'],['Con 2 società',EUR(10*RM)+' × i dadi'],['Prezzo',EUR(150)]]],

      corner:['Angolo',[[t.sub||'','']]],toll:['Strada a pedaggio',[['Pedaggio per entrare',EUR(TOLL)],['Il proprietario paga',EUR(TOLL/2)],['Prezzo',EUR(t.p||0)]]],air:['Aeroporto',[['Biglietto aereo',EUR(AIRTK)],['Va al proprietario','tutto'],['Il proprietario paga',EUR(AIRTK/5)],['Prezzo',EUR(t.p||0)]]]}[t.t]||(t.t.startsWith('sg')?['Via delle sagre',[[t.sub||'',''],['Oggi',sagOpen()?'aperta':'chiusa']]]:['Strada interna',[[t.sub||'','']]]);
    h=`<div class="deedTop"><small>${txt[0]}</small><div>${t.ic} ${t.n}</div></div><div class="rows">`+txt[1].map(r=>`<div class="row"><span>${r[0]}</span><b>${r[1]}</b></div>`).join('')+own+`</div>`;
  }
  deed.innerHTML=h;
  const P=$('plus'),Mi=$('minus'),Mo=$('mort'),why=$('why');why.textContent='';

  else{const a=actor(),mine=o===a&&canAct();Mo.style.display=buyable?'':'none';
    const nb=isP?whyNoBuild(a,i):'x',nsl=isP?whyNoSell(a,i):'x';
    P.disabled=!mine||!!nb;Mi.disabled=!mine||!!nsl;
    P.textContent=isP?(st[i].lv===4?'+ Albergo ':'+ Casa ')+EUR(HC[t.g]):'+ Casa';Mi.textContent=isP?'− Vendi '+EUR(HC[t.g]/2):'− Vendi';
    if(buyable){const m=GM.mort[i];Mo.textContent=m?'Riscatta '+EUR(Math.ceil(t.p/2*1.1)):'Ipoteca +'+EUR(t.p/2);Mo.disabled=!mine||(m?a.cash<Math.ceil(t.p/2*1.1):!!whyNoMort(a,i));}
    if(mine&&isP&&nb&&st[i].lv<5)why.textContent=nb;else if(o&&o!==a&&!canDeco(i))why.textContent='Solo '+o.name+' può costruire e decorare qui.';else if(o&&!mine&&canDeco(i))why.textContent='Puoi decorare sempre. Case e alberghi solo nel tuo turno.';}
  $('custom').classList.toggle('off',!isP||!canDeco(i));
  if(isP){const s=st[i];
    swSet('swWall',s.wall);swSet('swRoof',s.roof);swSet('swAcc',s.acc||s.roof);
    {const hv=s.lv===5,hn={grand:'Grand Hotel',vetro:'Torre vetro',chalet:'Chalet',castello:'Castello',terrazze:'Terrazze'}[s.hstyle]||'';
      $('edWhat').textContent=s.lv?(hv?'Stai colorando l’albergo ('+hn+').':'Stai colorando le case.'):'Qui non c’è ancora niente: i colori si vedranno sulla prima casa.';
      $('labWall').textContent=hv&&s.hstyle==='vetro'?'Vetrate':hv&&s.hstyle==='castello'?'Mura di pietra':'Muri';
      $('labRoof').textContent=hv&&s.hstyle==='vetro'?'Tetto e fianco':hv&&s.hstyle==='terrazze'?'Bordi delle terrazze':hv&&s.hstyle==='castello'?'Tetti delle torri':'Tetto';
      $('labAcc').textContent=hv?(s.hstyle==='castello'?'Portone e stendardi':s.hstyle==='terrazze'?'Pensilina e vasi':'Pensilina d’ingresso'):'Persiane e porta';}
    document.querySelectorAll('#orn button').forEach(e=>e.classList.toggle('on',s.orn[e.dataset.k]));
    const th=themeOk(t.g);
    document.querySelectorAll('#thm button').forEach(e=>{e.classList.toggle('on',e.dataset.k===grp[t.g].theme);e.disabled=!th;});document.querySelectorAll('#swL i').forEach(e=>e.classList.toggle('on',e.dataset.c===grp[t.g].light));
    document.querySelectorAll('#styH button').forEach(e=>e.classList.toggle('on',e.dataset.k===s.style));document.querySelectorAll('#styA button').forEach(e=>e.classList.toggle('on',e.dataset.k===s.hstyle));}
}
function bump(k){if(T[sel].t!=='prop')return;const s=st[sel];
  if(!GM.on){s.lv=Math.max(0,Math.min(5,s.lv+k));rebuild(sel,k>0);select(sel);return;}
  const a=actor();if(!canAct())return;if(k>0){if(whyNoBuild(a,sel))return;buildHouse(a,sel);}else{if(whyNoSell(a,sel))return;sellHouse(a,sel);}ui();}
$('plus').onclick=()=>bump(1);$('minus').onclick=()=>bump(-1);
$('mort').onclick=()=>{const a=actor(),i=sel;if(!canAct()||GM.owner[i]!==a)return;if(GM.mort[i])unmortgage(a,i);else if(!whyNoMort(a,i))mortgage(a,i);ui();};
const deco=fn=>()=>{if(T[sel].t!=='prop'||!canDeco(sel))return;fn();select(sel);decoSync(sel);};
function swatches(id,list,key){const el=$(id);list.forEach(c=>{const i=document.createElement('i');i.style.background=c;i.dataset.c=c;i.onclick=deco(()=>{st[sel][key]=c;rebuild(sel);});el.appendChild(i);});
  const p=document.createElement('label');p.className='pick';p.title='Colore a scelta';p.innerHTML='<span>＋</span><input type="color">';p.querySelector('input').onchange=e=>{const c=e.target.value;if(!/^#[0-9a-f]{6}$/i.test(c))return;deco(()=>{st[sel][key]=c;rebuild(sel);})();};el.appendChild(p);}

function resize(){const w=wrap.clientWidth,h=wrap.clientHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();}
addEventListener('resize',resize);
function loop(){
  requestAnimationFrame(loop);const now=performance.now();
  for(let n=segs.length-1;n>=0;n--){const sg=segs[n],k=Math.min(1,(now-sg.t0)/sg.dur),m=sg.pl.mesh;m.position.lerpVectors(sg.a,sg.b,k);m.position.y+=Math.sin(k*Math.PI)*.55;
    if(k>=1){if(!sg.vis)sg.pl.pos=sg.to;sg.pl.vpos=sg.to;m.position.copy(sg.b);segs.splice(n,1);sg.res();}}
  for(const i in bldG){const g=bldG[i],t0=g.userData.t0;if(t0){const k=Math.min(1,(now-t0)/450),e=1+2.2*Math.pow(k-1,3)+1.2*Math.pow(k-1,2);g.scale.setScalar(Math.max(.05,e)*BS);if(k>=1){g.scale.setScalar(BS);g.userData.t0=0;}}}
  if(marker)marker.position.y=.02+Math.sin(now/300)*.02;
  centroG.forEach(q=>{if(q&&q.userData.spin)q.userData.spin.rotation.z+=.004;if(q&&q.userData.tick)q.userData.tick(now);});skyTick(now);lifeTick(now);flyTick(now);
  updateCam();renderer.render(scene,camera);
}
